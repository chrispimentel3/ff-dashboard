services:
  - type: web
    name: mega-bowl-ask-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r service/requirements.txt
    startCommand: uvicorn service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /health
